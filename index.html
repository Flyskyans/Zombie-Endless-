<!DOCTYPE html>  
<html lang="ru">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">    
    <title>Bunker Defense</title>    
    <style>    
        body {    
            margin: 0;    
            padding: 0;    
            overflow: hidden;    
            background: #111;    
            touch-action: none;    
        }    
        canvas {    
            display: block;    
            image-rendering: pixelated; 
            image-rendering: crisp-edges;    
        }    
        #ui {    
            position: absolute;    
            top: 10px;    
            left: 10px;    
            color: white;    
            font-family: sans-serif;    
            font-size: 18px;    
            text-shadow: 1px 1px 2px black;    
            pointer-events: none;    
        }    
    </style>    
</head>    
<body>  
    <div id="ui">Здоровье бункера: <span id="bunkerHp">100</span></div>    
    <canvas id="gameCanvas"></canvas>  
    
    <script>    
        const canvas = document.getElementById("gameCanvas");    
        const ctx = canvas.getContext("2d");    

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Загрузка изображений
        const groundImg = new Image();
        groundImg.src = 'Ground.png';

        const bunkerImg = new Image();
        bunkerImg.src = 'Bunker.png';

        // Загрузка анимации зомби (Zomatk1.jpg - Zomatk9.jpg)
        const zombieFrames = [];
        for (let i = 1; i <= 9; i++) {
            const img = new Image();
            img.src = `Zomatk${i}.jpg`;
            zombieFrames.push(img);
        }

        // Игровой мир и камера
        const camera = {
            x: 0,
            y: 0
        };

        // Бункер размером в 1 чанк (256x256)
        const bunker = {
            x: 0,
            y: 0,
            width: 256,
            height: 256,
            hp: 100
        };

        let zombies = [];
        let spawnTimer = 0;

        // Управление перемещением камеры
        let isDragging = false;
        let startX = 0, startY = 0;

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            camera.x -= dx;
            camera.y -= dy;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        // Класс Зомби
        class Zombie {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 50;
                this.height = 50;
                this.speed = 1.5;
                this.animFrame = 0;
                this.animTimer = 0;
                this.facingRight = true;
            }

            update() {    
                const dx = bunker.x - this.x;    
                const dy = bunker.y - this.y;    
                const dist = Math.hypot(dx, dy);    

                if (dist > 128) {    
                    this.x += (dx / dist) * this.speed;    
                    this.y += (dy / dist) * this.speed;    

                    if (dx !== 0) {
                        this.facingRight = dx > 0;
                    }

                    this.animTimer++;    
                    if (this.animTimer % 8 === 0) {    
                        this.animFrame = (this.animFrame + 1) % 9;    
                    }    
                } else {    
                    this.animFrame = 0;    
                    if (Math.random() < 0.05) {    
                        bunker.hp -= 1;    
                        document.getElementById('bunkerHp').innerText = Math.max(0, bunker.hp);    
                    }    
                }    
            }    

            draw() {    
                ctx.save();    
                ctx.translate(this.x - camera.x, this.y - camera.y);    
                
                if (!this.facingRight) {
                    ctx.scale(-1, 1);
                }

                let currentImg = zombieFrames[this.animFrame];    
                if (currentImg && currentImg.complete && currentImg.naturalWidth !== 0) {    
                    ctx.drawImage(currentImg, -this.width / 2, -this.height / 2, this.width, this.height);    
                } else {    
                    ctx.fillStyle = 'green';    
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);    
                }    
                    
                ctx.restore();    
            }
        }

        // Спавн зомби по кругу
        function spawnZombie() {
            const angle = Math.random() * Math.PI * 2;
            const distance = 800;
            const x = bunker.x + Math.cos(angle) * distance;
            const y = bunker.y + Math.sin(angle) * distance;
            zombies.push(new Zombie(x, y));
        }

        // Главный игровой цикл
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Отрисовка бесконечной земли    
            const tileSize = 256;    
            const startX = Math.floor(camera.x / tileSize) * tileSize;    
            const startY = Math.floor(camera.y / tileSize) * tileSize;    

            for (let x = startX - tileSize; x < camera.x + canvas.width + tileSize; x += tileSize) {    
                for (let y = startY - tileSize; y < camera.y + canvas.height + tileSize; y += tileSize) {    
                    if (groundImg.complete && groundImg.naturalWidth !== 0) {    
                        let drawX = Math.floor(x - camera.x);
                        let drawY = Math.floor(y - camera.y);
                        ctx.drawImage(groundImg, drawX, drawY, tileSize + 1, tileSize + 1);    
                    }    
                }    
            }    

            // 2. Отрисовка бункера в 1 чанк
            ctx.save();    
            ctx.translate(Math.floor(bunker.x - camera.x), Math.floor(bunker.y - camera.y));    
            if (bunkerImg.complete && bunkerImg.naturalWidth !== 0) {    
                ctx.drawImage(bunkerImg, -bunker.width / 2, -bunker.height / 2, bunker.width, bunker.height);    
            } else {    
                ctx.fillStyle = 'gray';    
                ctx.fillRect(-bunker.width / 2, -bunker.height / 2, bunker.width, bunker.height);    
            }    
            ctx.restore();    

            // 3. Спавн и обновление зомби    
            spawnTimer++;    
            if (spawnTimer > 60 && bunker.hp > 0) {    
                spawnZombie();    
                spawnTimer = 0;    
            }    

            if (bunker.hp > 0) {    
                zombies.forEach(z => z.update());    
            }    

            zombies.forEach(z => z.draw());    

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>  
</body>
</html>
